  narrative_outcome: Captain Flynn's expression remains stern as he pauses to consider
    your plea, the sound of the waves crashing against the shore filling the air.
    After a moment of silence, he speaks in a deep, commanding voice, 'I've heard
    your words, but leaving Tortuga's Isle isn't a decision to be taken lightly. What
    makes you think it's time to seek better fortunes elsewhere?'
  mechanical_updates: []
