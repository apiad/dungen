  - captain_flynn
  player_action: we are burning through our reserves of food and wine, the crew is
    growing anxious, and there is no sign we can find that treasure in this island,
    we have been diging holes for months now, three have died of malaria, two more
    are sick... do i need to continue? -- i plea
  narrative_outcome: The young pirate's words hung in the air, laced with desperation
