id: find_treasure
title: Tortuga's Treasure and the Buccaneer's Dilemma
genre: Swashbuckling Adventure
premise: The sun is setting on Tortuga's Isle, and with it, the hopes of the stranded
  Drunken Buccaneers. Their ship, the 'Maverick's Revenge', lies crippled on the ocean
  floor, a victim of the treacherous seas and Captain Flynn's questionable leadership.
  You are First Mate Barnaby Blackheart, a battle-hardened pirate with a keen mind
  for navigation and a thirst for adventure. As you mingle with the island's shady
  characters and hear whispers of a hidden treasure, you begin to formulate a plan
  to save your crew and claim the treasure for yourself.
goal: Retake control of the Drunken Buccaneers, repair the Maverick's Revenge, and
  sail away with the treasure.
starting_location_id: coconut_shores
available_characters:
- id: first_mate_barnaby
  name: Barnaby Blackheart
  role: First Mate
  description: A seasoned pirate with a rugged charm and a strategic mind. His weathered
    face tells tales of countless battles, and his eye patch hides a missing eye lost
    in a skirmish with the British Navy.
  traits:
  - Charismatic
  - Strategic Thinker
  - Combat-Ready
  resilience: 1.8
  sociability: 1.5
- id: captain_flynn
  name: Captain Flynn
  role: Captain of the Drunken Buccaneers
  description: The charismatic but troubled leader of the Drunken Buccaneers. His
    charm has kept his crew loyal, but his drinking problem and poor decision-making
    have led them to their current predicament.
  traits:
  - Charming
  - Indecisive
  - Alcoholic
  resilience: 1.2
  sociability: 1.8
- id: swabbie_stu
  name: Stu 'The Swabbie'
  role: Swabbie
  description: A young and eager pirate who's been with the crew since its inception.
    He's fiercely loyal but naive about the harsh realities of piracy.
  traits:
  - Loyal
  - Optimistic
  - Inexperienced
  resilience: 1.0
  sociability: 1.2
- id: doc_rod
  name: Doctor Rod
  role: Ship's Doctor
  description: The crew's medic, who keeps them alive despite their many injuries.
    He's as skilled with a scalpel as he is with a pistol.
  traits:
  - Resourceful
  - Stoic
  - Healing Hands
  resilience: 1.5
  sociability: 1.0
